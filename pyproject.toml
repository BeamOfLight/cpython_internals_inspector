[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cpython-internals-inspector"
dynamic = ["version"]
description = "A tool for inspecting the internal layout of CPython objects"
requires-python = ">=3.11,<3.15"
dependencies = [
    "prettytable>=3"
]
readme = "README.md"

[dependency-groups]
dev = [
    "pre-commit>=3.0",
    "pytest",
    "cibuildwheel",
]

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
before-build = "curl -L https://raw.githubusercontent.com/python/pythoncapi-compat/main/pythoncapi_compat.h -o {project}/src/cpython_internals_inspector/pythoncapi_compat.h"
build = "cp311-* cp312-* cp313-* cp314-*"
skip = ["*-win32", "*-manylinux_i686", "*-musllinux*"]
test-command = "python -c \"import cpython_internals_inspector as cii; d=dict(a=1,b=2,c=3); del d['b']; print(cii.inspect(d))\""
