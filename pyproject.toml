[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpython-internals-inspector"
version = "0.1.1"
description = "A tool for inspecting the internal layout of CPython objects"
requires-python = ">=3.13,<3.15"
dependencies = []
readme = "README.md"

[dependency-groups]
dev = [
    "pre-commit>=3.0",
    "pytest",
    "cibuildwheel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp313-* cp314-*"
skip = ["*-win32", "*-manylinux_i686", "*-musllinux*"]
test-command = "python -c \"import cpython_internals_inspector as cii; print(cii.inspect({'a':1}))\""
